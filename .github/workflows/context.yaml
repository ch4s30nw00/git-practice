name: Contexts
on: push
jobs:
  print:                    # job ID
    runs-on: ubuntu-latest  # 러너(실행 환경)
    steps:                  # 러너가 할 작업
      - run: echo "${{ github.actor }}"
      - name: Github Context
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Actor: ${{ github.actor }}"
          echo "Event: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"

